# Fixture structure.yaml (resolver section only; naming templates and tier
# roots are P2+). Values below mirror the built-in defaults; the schema is
# what matters — the real file lives in the private music-rules repo.
resolver:
  weights:
    purity: 0.35
    seq: 0.25
    artifacts: 0.15
    name_parse: 0.15
    quality_homog: 0.10
  thresholds:
    resolved: 0.80
    review: 0.50
  lossy_tolerance_kbps: 256
  hires:
    bit_depth_over: 16
    sample_rate_over: 48000

# Tier routing (doc 02). Roots are synthetic fixture paths; assign only
# computes target strings, it never touches these locations.
tiers:
  music.uhq: { root: /library/music.uhq, gate: hires, growth: active }
  music.hq: { root: /library/music.hq, gate: lossless-first, growth: primary }
  music: { root: /library/music, gate: none, growth: frozen } # never a target

assign:
  weights: { artist: 0.5, label: 0.25, similar: 0.15, style: 0.10 }
  short_circuit: { min_releases: 2, confidence: 0.95 }
  needs_review: { confidence: 0.6, margin: 0.2 }
  shim_accept_distance: 0.15

naming:
  release: "{artist} [{year}] {album} ({label}; {catno})"
  release_no_label: "{artist} [{year}] {album}"
